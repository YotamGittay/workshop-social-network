services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: social
      POSTGRES_PASSWORD: social
      POSTGRES_DB: social
      # Apple container volumes contain lost+found; initdb needs an empty dir
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social -d social"]
      interval: 2s
      timeout: 3s
      retries: 20

  blob:
    # quay.io mirror: docker-for-apple-container shim gets 401 on docker.io org repos
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - blob-data:/data
    ports:
      - "9001:9001" # MinIO web console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://social:social@db:5432/social
      S3_ENDPOINT: http://blob:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: images
    # NOTE: shim treats depends_on as ordering only; backend retries
    # both Postgres and MinIO (bucket creation) until they are ready.
    depends_on:
      - db
      - blob
    ports:
      - "8000:8000" # direct API access (docs at /docs)

  frontend:
    build: ./frontend
    # shim writes /etc/hosts entries only for depends_on services;
    # nginx proxies to both backend and blob, so both must be listed
    depends_on:
      - backend
      - blob
    ports:
      - "3000:80"

  urls:
    image: alpine:latest
    depends_on:
      - frontend
    command: sh -c "echo ''; echo '================================================'; echo ' Workshop Social Network is up!'; echo '   Frontend:      http://localhost:3000'; echo '   API docs:      http://localhost:8000/docs'; echo '   MinIO console: http://localhost:9001 (minioadmin/minioadmin)'; echo '================================================'"

volumes:
  db-data:
  blob-data:
